<!DOCTYPE html>
<html>
<head>
    <title>Student Order Page</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .main-section {
            min-height: 85vh;
        }
    </style>
</head>

<body class="bg-light">

<!-- NAVIGATION (STUDENT ONLY) -->
<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Food Ordering</a>
    <a href="index.html" class="btn btn-outline-light btn-sm">Home</a>
  </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container main-section d-flex justify-content-center align-items-center">
  <div class="card shadow-lg p-5" style="width: 500px; border-radius: 15px;">

    <h3 class="text-center mb-4">Place Your Order</h3>

    <form id="orderForm">

      <div class="mb-4">
        <label class="form-label fw-semibold">Your Name</label>
        <input type="text" id="name" class="form-control form-control-lg" required>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Food Order</label>
        <input type="text" id="order" class="form-control form-control-lg" required>
      </div>

      <button type="submit" class="btn btn-warning btn-lg w-100">
        Submit Order
      </button>

    </form>

  </div>
</div>

<script src="student.js"></script>

</body>
</html>
