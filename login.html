<!DOCTYPE html>
<html>
<head>
    <title>Seller Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 400px;">
    <h2 class="text-center mb-4">Seller Login</h2>

    <div class="card shadow p-4">
        <div class="mb-3">
            <input type="text" id="username" class="form-control" placeholder="Username">
        </div>
        <div class="mb-3">
            <input type="password" id="password" class="form-control" placeholder="Password">
        </div>
        <button id="loginBtn" class="btn btn-dark w-100">Login</button>
        <p id="errorMsg" class="text-danger mt-2 text-center"></p>
    </div>
</div>

<script>
    const SELLER_USERNAME = "seller"; // Change if needed
    const SELLER_PASSWORD = "1234";   // Change if needed

    document.getElementById("loginBtn").addEventListener("click", () => {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        if(username === SELLER_USERNAME && password === SELLER_PASSWORD) {
            localStorage.setItem("isSellerLoggedIn", "true");
            window.location.href = "seller.html";
        } else {
            document.getElementById("errorMsg").textContent = "Invalid username or password!";
        }
    });
</script>

</body>
</html>
